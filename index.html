<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덱 요청서</title>
<style>
@font-face{font-family:'InstrumentLocal';src:url('instrument-sans.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'WantedLocal';src:url('wanted-sans.woff2') format('woff2');font-weight:100 900;font-display:block}
:root{--night:#0E131C;--deep:#1A2232;--steel:#2A3550;--slate:#8EA2C8;--ice:#E8EEF8;--violet:#9B8CFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--ice)}
body{font-family:'InstrumentLocal','WantedLocal',sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:72px 24px 160px}
.wrap{max-width:760px;margin:0 auto}
.kick{font-size:13px;letter-spacing:.14em;color:var(--slate);font-weight:600}
h1{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:10px 0 8px}
.lead{color:var(--slate);margin-bottom:48px}
.done{display:grid;grid-template-columns:44px 1fr auto;gap:4px 16px;padding:18px 0;align-items:start}
.done .n{font-weight:700;color:var(--slate);font-variant-numeric:tabular-nums}
.done .q{font-size:14px;color:var(--slate)}
.done .a{grid-column:2;white-space:pre-wrap;word-break:break-word}
.done .a.empty{color:#56627C}
.done button{grid-row:1/3;grid-column:3}
.cur{margin-top:24px;background:var(--deep);padding:32px 32px 28px}
.cur .n{font-size:14px;color:var(--slate);font-weight:600;font-variant-numeric:tabular-nums}
.cur h2{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:6px 0 6px}
.cur .hint{font-size:14.5px;color:var(--slate);margin-bottom:18px;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font:inherit;font-size:15px;background:var(--steel);color:var(--ice);border:0;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--violet);color:var(--night);font-weight:600}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;color:var(--ice);background:var(--night);border:0;outline:0;padding:14px 16px;line-height:1.6}
textarea:focus{background:#0A0E15}
textarea::placeholder{color:#56627C}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;border:0;padding:10px 18px;cursor:pointer;background:var(--steel);color:var(--ice)}
.btn.main{background:var(--violet);color:var(--night)}
.btn:disabled{opacity:.4;cursor:default}
.ghost{font:inherit;font-size:14px;background:none;border:0;color:var(--slate);cursor:pointer;padding:2px 0}
.ghost:hover{color:var(--ice)}
.keys{font-size:13px;color:#56627C;margin-left:auto}
.sum{margin-top:24px;background:var(--deep);padding:32px}
.sum h2{font-size:26px;font-weight:700;margin-bottom:6px}
.sum pre{font:inherit;font-size:15px;white-space:pre-wrap;word-break:break-word;background:var(--night);padding:18px 20px;margin:16px 0 0;max-height:420px;overflow:auto}
.meta{font-size:13.5px;color:var(--slate);margin-top:8px;font-variant-numeric:tabular-nums}
.meta.over{color:var(--violet)}
.status{font-size:15px;margin-top:14px;min-height:24px}
.qh{font-size:13px;letter-spacing:.12em;color:var(--slate);margin:36px 0 8px;font-weight:600}
.qi{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ice);background:var(--night);border:0;padding:12px 16px;margin-bottom:6px;cursor:pointer}
.qi:hover{background:#0A0E15}
.qi span:first-child{color:var(--slate);font-variant-numeric:tabular-nums}
.okc{color:var(--violet)}
.prog{display:flex;gap:6px;margin:0 0 8px}
.prog i{flex:1;height:4px;background:var(--steel)}
.prog i.f{background:var(--slate)}
.prog i.c{background:var(--violet)}

.wait{margin-top:24px;background:var(--deep);padding:36px 32px}
.code{font-size:44px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.think{font-size:24px;font-weight:600;margin-top:28px;display:flex;align-items:baseline;gap:2px}
.think i{font-style:normal;opacity:.15;animation:dot 1.4s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,20%{opacity:.15}40%{opacity:1}80%,100%{opacity:.15}}
.think.stop i{animation:none;opacity:0}
.bar{height:4px;background:var(--steel);margin-top:18px;overflow:hidden}
.bar b{display:block;height:100%;width:30%;background:var(--violet);animation:run 1.8s ease-in-out infinite}
@keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.bar.stop b{animation:none;width:100%;transform:none}
.mini{font-size:14px;color:var(--slate);margin-top:10px;font-variant-numeric:tabular-nums}
.look{margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.look input{font:inherit;font-size:15px;color:var(--ice);background:var(--night);border:0;outline:0;padding:10px 14px;width:180px;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">DECK REQUEST</div>
  <h1>덱 요청서</h1><div class="mini" style="margin:-2px 0 6px;color:var(--ice)">Claude Opus 5.5에 최적화됨.</div><div class="mini" style="margin:0 0 4px">결과가 나오면 본인 계정의 Claude Opus 5.5에 복사해 붙여 넣으시오.</div><div id="pend" style="margin:-4px 0 32px"></div>
  <div class="prog" id="prog"></div>
  <div id="flow"></div>
  <div id="stage"></div>
</div>
<script>
const Q=[
 {k:'what',t:'무엇을 만드나요?',h:'종류를 고르고 제목이나 주제를 적는다.',chips:['발표 덱','읽는 자료','방송 화면','웹사이트','표지·포스터','보고서','기타'],ph:'예) 투자제안서, 전공유연화 성과포럼 발표',req:true},
 {k:'purpose',t:'누가, 어떻게 보고, 보고 나서 무엇을 하나요?',h:'청중, 보는 방식(발표를 들으며 / 혼자 읽음 / 인쇄 / 화면 송출), 보고 난 뒤의 행동.',chips:['무대 발표','혼자 읽음','심사·평가','투자 유치','의사결정','정기 보고','강의','방송'],ph:'예) 심사위원 5명이 점수표를 옆에 두고 혼자 읽음. 점수를 매김.',req:true},
 {k:'size',t:'분량과 형식은?',h:'장 수, 발표 시간, 비율, 마감.',chips:['16:9','4:3','세로 A4','1920×1080'],ph:'예) 9장, 10분, 12월 4일 발표',req:false},
 {k:'slides',t:'장마다 무엇이 들어가나요?',h:'한 줄에 한 장씩. 역할, 결론 문장, 보여 줄 방식(차트·표·숫자·면·글).\n모르면 비워 두면 구성을 제안받는다.',chips:[],ph:'1 표지: 제목, 이름\n2 시장: 수도권 저온 물류 면적이 5년간 연 11% 늘어남, 막대 차트\n3 ...',req:false,tall:true},
 {k:'data',t:'들어갈 숫자, 자료, 출처는?',h:'실제 값이 있으면 그대로, 없으면 자리표시자로 둔다.',chips:['값 있음','자리표시자로','출처 찾아 줘'],ph:'예) 2021~2025 면적 412, 455, 508, 566, 628 (만 ㎡), 자료: 국토교통부',req:false,tall:true},
 {k:'mood',t:'어떤 분위기였으면 하나요?',h:'말로 적는다.',chips:['다크','라이트','차분하게','강하게','고급스럽게','데이터 중심'],ph:'예) 투자 리서치처럼 단단하고 어두운 화면, 숫자가 먼저 보이게',req:false},
 {k:'brand',t:'강조색, 로고, 글꼴 요구는?',h:'강조색은 화면마다 한 곳에 쓴다. 정해진 브랜드가 없으면 비워 둔다.',chips:['바이올렛 #9B8CFF','루비','알아서 골라 줘','로고 있음'],ph:'예) A.donis Research 로고, 제목은 명조',req:false},
 {k:'rules',t:'꼭 지킬 것과 피할 것은?',h:'기본 규칙(테두리·띠 배경·점 질감·둥근 모서리 금지, 차트마다 출처 줄, 결론형 제목, 한국어 문어체)은 이미 들어간다. 그 밖의 것만 적는다.',chips:['차트 한 장에 하나','숫자 크게','글 최소','이미지 모델 사용'],ph:'예) 실명 대신 자리표시자, 2쪽 이내',req:false}
];
const KEY='deckreq_v1';
let st={i:0,a:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.a)st=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ans(k){return st.a[k]||{chips:[],text:''}}
function fmt(k){const a=ans(k);const p=[];if(a.chips.length)p.push(a.chips.join(', '));if(a.text.trim())p.push(a.text.trim());return p.join('\n')}
function prog(){$('#prog').innerHTML=Q.map((q,j)=>`<i class="${j<st.i?'f':j===st.i?'c':''}"></i>`).join('')}
function render(){
  stopTimers&&stopTimers();renderPend();
  prog();
  $('#flow').innerHTML=Q.slice(0,st.i).map((q,j)=>{const v=fmt(q.k);return `<div class="done"><span class="n">${String(j+1).padStart(2,'0')}</span><span class="q">${esc(q.t)}</span><span class="a ${v?'':'empty'}">${v?esc(v):'비워 둠'}</span><button class="ghost" data-edit="${j}">고치기</button></div>`}).join('');
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{st.i=+b.dataset.edit;save();render()});
  if(st.i<Q.length) renderQ(); else renderSum();
}
function renderQ(){
  const q=Q[st.i],a=ans(q.k);
  $('#stage').innerHTML=`<div class="cur"><div class="n">${String(st.i+1).padStart(2,'0')} / 08</div><h2>${esc(q.t)}</h2><div class="hint">${esc(q.h)}</div>
  ${q.chips.length?`<div class="chips">${q.chips.map(c=>`<button class="chip ${a.chips.includes(c)?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
  <textarea id="ta" placeholder="${esc(q.ph)}" style="min-height:${q.tall?180:96}px">${esc(a.text)}</textarea>
  <div class="row"><button class="btn main" id="next">${st.i===Q.length-1?'마치기':'다음'}</button>${st.i>0?'<button class="btn" id="back">이전</button>':''}${q.req?'':'<button class="ghost" id="skip">건너뛰기</button>'}<span class="keys">Enter 다음 · Shift+Enter 줄바꿈</span></div></div>`;
  const ta=$('#ta');
  const keep=()=>{st.a[q.k]={chips:[...document.querySelectorAll('.chip.on')].map(b=>b.dataset.c),text:ta.value};save()};
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');keep()});
  ta.oninput=keep;
  const go=()=>{keep();if(q.req&&!fmt(q.k)){ta.focus();ta.placeholder='이 질문은 답이 필요함. '+q.ph;return}st.i++;save();render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
  $('#next').onclick=go;
  if($('#back'))$('#back').onclick=()=>{keep();st.i--;save();render()};
  if($('#skip'))$('#skip').onclick=()=>{st.a[q.k]={chips:[],text:''};st.i++;save();render()};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();go()}};
  ta.focus();
}
function compile(code){
  const d=new Date();const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let s=`[요청 코드 ${code||''}]\n[덱 요청서 ${ds}]
`;
  Q.forEach((q,j)=>{const v=fmt(q.k);s+=`\n${j+1}. ${q.t}\n${v||'(비워 둠, 알아서 제안)'}\n`});
  return s;
}
let DESC=null;
async function loadDesc(){if(DESC)return DESC;const r=await fetch('desc.json');DESC=await r.json();return DESC}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const DEF={'발표 덱':['미니멀·개념','기하 추상·하드에지','색면 추상','정밀주의·미국 모더니즘','포스터·타이포'],'읽는 자료':['미니멀·개념','기하 추상·하드에지','정밀주의·미국 모더니즘','색면 추상','포스터·타이포'],'보고서':['미니멀·개념','기하 추상·하드에지','정밀주의·미국 모더니즘','색면 추상','포스터·타이포'],'방송 화면':['포스터·타이포','기하 추상·하드에지','미니멀·개념','오르피즘·구성주의·미래주의','사진'],'웹사이트':['기하 추상·하드에지','미니멀·개념','오르피즘·구성주의·미래주의','로고·기업 모더니즘','색면 추상'],'표지·포스터':['포스터·타이포','기하 추상·하드에지','색면 추상','팝아트','입체주의·콜라주']};
const PRES={'투자 유치':['pitch-book','sequoia-pitch-deck'],'심사·평가':['mckinsey-style','pitch-book'],'의사결정':['bcg-style','mckinsey-style'],'정기 보고':['qbr','guide-to-the-markets'],'무대 발표':['keynote-minimal','ted-style'],'혼자 읽음':['six-pager','memo'],'강의':['seminar','keynote-minimal'],'방송':['ticker','guide-to-the-markets']};
const GOOD=['사각형','격자','띠·선','글자·타이포','차트·숫자','추상'];
function pickSources(){
  const a1=ans('what').chips,a2=ans('purpose').chips,a6=ans('mood').chips;
  let movs=(DEF[a1[0]]||DEF['발표 덱']).slice();
  if(a6.includes('라이트')&&!movs.includes('사진'))movs[movs.length-1]='사진';
  const R=rng(hash(JSON.stringify(st.a)+Date.now()%100000));
  const cand=[];
  movs.forEach(m=>{
    let L=DESC.filter(o=>o.m===m).map(o=>({o,sc:(o.q?2:0)+o.s.filter(t=>GOOD.includes(t)).length-(o.s.includes('인물')?1:0)+R()*1.5}));
    L.sort((x,y)=>y.sc-x.sc);
    L.slice(0,3).forEach(x=>cand.push(x.o));
  });
  let slugs=[];a2.forEach(c=>(PRES[c]||[]).forEach(x=>{if(!slugs.includes(x))slugs.push(x)}));
  if(a1.includes('방송 화면'))slugs.unshift('ticker');
  slugs=[...new Set(slugs)];
  if(!slugs.length)slugs=['keynote-minimal','mckinsey-style'];
  const pres=slugs.slice(0,2).map(sl=>DESC.find(o=>o.id==='S'+sl)).filter(Boolean);
  return {movs,cand,pres};
}
function buildInput(src){
  const L=[];
  L.push(`You write design prompts for slide decks, broadcast screens, web pages and covers. Follow this method exactly.

METHOD
1. From the CANDIDATE MOVEMENT DESCRIPTIONS below, choose exactly two descriptions from two different movements (you choose the movements; the user does not) whose structure and mood best fit what the request must show (planes, grids, rows, bands, a single hero form, rows of figures). Choose exactly one of the PRESENTATION DESCRIPTIONS below for slide rules.
2. Rewrite each chosen description. Keep its number of sentences, their order and their sentence frames. Swap only the subject, color, material and position words so each sentence describes the requested screen. Never write a new description in your own words. Add function or motion only as one extra paragraph after a rewritten description.
3. Wherever a source mentions any FORBIDDEN item, rewrite that phrase in place into its plain opposite (a rule becomes open space, a border becomes no border, a gradient becomes flat steps, a dot texture becomes a flat plane, gold or amber becomes another color).
4. Assign each rewritten description to the slides or screens it governs. Use the user's slide list if given; if not, propose a slide list that fits the purpose and length.
5. Pair fonts that suit the chosen descriptions: one Latin face and one Korean face for titles, the same or another pair for body, and a figure face when figures matter. Always list the Latin face first and the Korean face second, require loading every face, and state that Korean falling back to Arial, Malgun Gothic or Consolas is a failure. Do not default to Pretendard.
6. Colors: one ground, a few neutrals stepped in lightness, one accent used in one place per slide. No amber or gold unless the user asked for it.

FIXED RULES TO WRITE INTO THE PROMPT
- Design comes before layout; every sentence of the rewritten descriptions must be visible on screen.
- All on-screen text is Korean written style; titles are declarative conclusion sentences ending in '~함' or '~다', never '~습니다'; no parallel couplets, no slogan lines, no dashes; terms without a standard Korean form stay in English.
- One chart per slide; every chart and table carries a source line.
- FORBIDDEN: borders, boxes drawn with lines, band backgrounds, title underlines, rounded corners, pills, shadows, decorative gradients, glow, dots, dotted, dashed or hatched marks, halftone textures, decorative icons.
- Build shapes in code. If any image model is used, the prompt must say the image contains no text, letters or numbers at all.
- Never put artist names, artwork titles or museum names inside the prompt.
- Use the user's placeholders as given; use {{발표자1}} style placeholders instead of real personal names unless the user wrote the name.

OUTPUT
Write the finished prompt in English, ready to paste, with these sections in order: the opening task line (format, size, slide count), [Color], [Typography], one section per rewritten description titled by the slides it governs (the rewritten sentences, then a short parenthesized implementation note), [Slide rules] from the presentation description, [Slides] (one line per slide with role, Korean title draft, exhibit), [Language of the slide text], [Forbidden], [Check], and a final line 'Fill the content from: [...]'.
Output only the prompt text. No preamble, no explanation, no code fence.
After the prompt, write one line '=== SOURCES ===' and then one line per source used: its ID, and which slides it governs.`);
  L.push('\nUSER REQUEST (Korean answers to eight questions)\n'+Q.map((q,j)=>`${j+1}. ${q.t}\n${fmt(q.k)||'(blank: decide)'}`).join('\n\n'));
  L.push('\nCANDIDATE MOVEMENT DESCRIPTIONS\n'+src.cand.map(o=>`[${o.id}] movement: ${o.m}\n${o.d}`).join('\n\n'));
  L.push('\nPRESENTATION DESCRIPTIONS\n'+src.pres.map(o=>`[${o.id}] ${o.t}\n${o.d}`).join('\n\n'));
  return L.join('\n');
}
let sampleFn=null,ctl=null,dbRef=null,qUnsub=null,QLIST=[];
const split=t=>{const i=t.indexOf('=== SOURCES ===');return i<0?[t,'']:[t.slice(0,i).trim(),t.slice(i+15).trim()]};
async function getDb(){if(dbRef)return dbRef;try{dbRef=await claude.use('db')}catch(e){dbRef=null}return dbRef}

  $('#rlabel').textContent=label||'';$('#out').textContent=prompt;$('#src').textContent=srcLine||'';

}
function renderQueue(){
  const el=$('#queue');if(!el)return;
  if(!QLIST.length){el.innerHTML='';return}
  el.innerHTML='<div class="qh">보낸 요청</div>'+QLIST.map(d=>{const v=d.data();const t=(v.title||'').slice(0,40);let when='';try{const d=new Date(v.createdAt);when=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}catch(e){}const stt=v.status==='done'?'<b class="okc">완성</b>':'대기 중';return `<button class="qi" data-id="${esc(d.id)}"><span>${esc(when)}</span><span>${esc(t)}</span><span>${stt}</span></button>`}).join('');
  el.querySelectorAll('.qi').forEach(bn=>bn.onclick=()=>{const d=QLIST.find(x=>x.id===bn.dataset.id);if(!d)return;const v=d.data();
    if(v.status==='done'&&v.prompt){showPrompt(v.prompt,v.sources?('쓴 원문: '+v.sources):'', '대화방에서 만든 프롬프트');window.scrollTo({top:$('#result').offsetTop-24,behavior:'smooth'})}
    else{$('#sstatus').textContent='아직 대기 중. 대화방에서 "요청 확인"이라고 하면 처리된다.'}});
}
async function watchQueue(){
  const db=await getDb();if(!db||qUnsub)return;
  const t=setTimeout(()=>{const s=$('#sstatus');if(s&&!QLIST.length)s.textContent=s.textContent||''},10000);
  qUnsub=db.collection('requests').orderBy('createdAt','desc').limit(20).onSnapshot(snap=>{clearTimeout(t);QLIST=snap.docs;renderQueue();
    const mine=QLIST[0];},e=>{clearTimeout(t)});
}
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSf9RwY_EAE6KwA-jn7nPnM1YfcVUOGpfXSV6egiB29Hxf0Qbw/formResponse';
const FORM_FIELD='entry.632644792';
const STATUS_URL=''; // Apps Script 웹 앱 주소를 배포 후 여기에 넣는다
const PKEY='deckreq_pending';
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCode(){const a=new Uint32Array(8);crypto.getRandomValues(a);let c='';a.forEach((v,i)=>{c+=ALPH[v%ALPH.length];if(i===3)c+='-'});return c}
function pending(){try{return JSON.parse(localStorage.getItem(PKEY)||'[]')}catch(e){return[]}}
function setPending(l){try{localStorage.setItem(PKEY,JSON.stringify(l.slice(0,10)))}catch(e){}}
function renderPend(){
  const l=pending().filter(x=>!x.done);const el=$('#pend');if(!el)return;
  el.innerHTML=l.length?`<button class="ghost" id="pendgo" style="margin-top:10px">진행 중인 요청 결과 보기</button>`:'';
  if(l.length)$('#pendgo').onclick=()=>showWait(l[0].code,l[0].at);
}
let pollT=null,tickT=null;
function stopTimers(){clearTimeout(pollT);clearInterval(tickT)}
function showWait(code,at){
  stopTimers();$('#flow').innerHTML='';$('#prog').innerHTML='';
  $('#stage').innerHTML=`<div class="wait" id="wait">
   <div class="kick">요청을 받았습니다</div>
   <div class="row" style="margin-top:6px"><button class="ghost" id="newreq">새 요청 쓰기</button></div>
   <div class="think" id="think"><span id="tmsg">생각 중입니다</span><i>.</i><i>.</i><i>.</i></div>
   <div class="bar" id="bar"><b></b></div>
   <div class="mini" id="elapsed"></div><div class="mini" id="note"></div>
   <pre id="res" style="display:none"></pre>
   <div class="mini" id="rhint" style="display:none;color:var(--ice)">아래 프롬프트를 복사해 본인 계정의 Claude Opus 5.5에 붙여 넣으시오.</div><div class="row" id="rrow" style="display:none"><button class="btn main" id="rcopy">프롬프트 복사</button><span class="status" id="rst" style="margin:0"></span></div></div>`;
  $('#newreq').onclick=()=>{stopTimers();st={i:0,a:{}};save();render()};
  const t0=at||Date.now();
  const tick=()=>{const s=Math.floor((Date.now()-t0)/1000);$('#elapsed').textContent=`경과 ${Math.floor(s/60)}분 ${String(s%60).padStart(2,'0')}초`;
    if(s>180&&!$('#note').dataset.long){$('#note').dataset.long=1;$('#note').textContent='처리에 시간이 걸리고 있음. 창을 닫아도 되고, 이 브라우저로 다시 오면 결과가 보임.'}};
  tick();tickT=setInterval(tick,1000);
  const MSG={received:'생각 중입니다',processing:'디자인을 정리하는 중입니다',none:'요청을 찾는 중입니다'};
  const poll=async()=>{
    if(!STATUS_URL){$('#tmsg').textContent='생각 중입니다';$('#note').textContent=$('#note').textContent||'접수됨. 결과 확인 창구가 연결되면 여기에 결과가 나타남.';return}
    try{
      const r=await fetch(STATUS_URL+'?code='+encodeURIComponent(code),{cache:'no-store'});const j=await r.json();
      if(j.status==='done'&&j.prompt){finish(code,j.prompt);return}
      if(j.status==='failed'){$('#tmsg').textContent='처리하지 못했습니다';$('#think').classList.add('stop');$('#bar').classList.add('stop');$('#note').textContent=j.message||'요청을 다시 보내 주세요.';stopTimers();return}
      $('#tmsg').textContent=MSG[j.status]||MSG.received;
    }catch(e){}
    pollT=setTimeout(poll,15000);
  };
  poll();
}
function finish(code,prompt){
  stopTimers();$('#tmsg').textContent='완성되었습니다';$('#think').classList.add('stop');$('#bar').classList.add('stop');$('#note').textContent='';
  $('#rhint').style.display='';const res=$('#res');res.style.display='';res.textContent=prompt;$('#rrow').style.display='';
  $('#rcopy').onclick=async()=>{try{await navigator.clipboard.writeText(prompt);$('#rst').textContent='복사함.'}catch(e){const r=document.createRange();r.selectNodeContents(res);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$('#rst').textContent='선택해 둠. ⌘C로 복사할 것.'}};
  setPending(pending().map(x=>x.code===code?{...x,done:true}:x));
}
function renderSum(){
  const code=st.code||(st.code=newCode(),save(),st.code);
  const text=compile(code);
  const shown=text.replace(/^\[요청 코드 [^\]]*\]\n/,'');
  $('#stage').innerHTML=`<div class="sum" id="sum"><h2>요청 보내기</h2>
  <pre id="pre">${esc(shown)}</pre>
  <div class="up" style="margin-top:24px">
    <div class="kick" style="margin-bottom:8px">참조할 원문 파일 (선택)</div>
    <div class="hint" style="color:var(--slate);margin-bottom:12px">원문 파일은 공개되지 않아요. PDF, Word, PowerPoint, Excel, 한글, 텍스트, 이미지 / 파일당 10MB, 5개까지.</div>
    <label class="btn" style="display:inline-block;cursor:pointer">파일 고르기<input type="file" id="files" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,.md,.hwp,.hwpx,.png,.jpg,.jpeg,.webp" style="display:none"></label>
    <div class="mini" id="flist"></div>
  </div>
  <div class="row"><button class="btn main" id="send">보내기</button><button class="ghost" id="reset">처음부터</button></div>
  <div class="status" id="status"></div></div>`;
  const S=$('#status'),send=$('#send');
  let picked=[];
  const fin=$('#files');
  if(!STATUS_URL){fin.disabled=true;$('#flist').textContent='파일 받기는 준비 중이에요.'}
  fin.onchange=()=>{
    const ok=/\.(pdf|docx?|pptx?|xlsx?|csv|txt|md|hwp|hwpx|png|jpe?g|webp)$/i;
    picked=[...fin.files].filter(f=>ok.test(f.name)&&f.size<=10*1024*1024).slice(0,5);
    const skipped=fin.files.length-picked.length;
    $('#flist').textContent=picked.length?picked.map(f=>`${f.name} (${(f.size/1048576).toFixed(1)}MB)`).join(' · ')+(skipped?` / ${skipped}개는 형식이나 크기 때문에 뺌`:''):(skipped?'보낼 수 있는 파일이 없음':'');
  };
  const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f)});
  send.onclick=async()=>{
    send.disabled=true;S.textContent='보내는 중';
    try{
      let full=text;
      if(picked.length&&STATUS_URL){
        S.textContent='파일을 올리는 중';
        const files=[];for(const f of picked)files.push({name:f.name,type:f.type,data:await b64(f)});
        let saved=0;
        try{const r=await fetch(STATUS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code,files})});const j=await r.json();saved=j.ok?j.saved:0}catch(e){saved=0}
        if(!saved){S.textContent='파일을 올리지 못함. 파일 없이 보내려면 파일 선택을 지우고 다시 누를 것.';send.disabled=false;return}
        full=text.replace('\n[덱 요청서',`\n[첨부 원문 ${saved}개]\n[덱 요청서`);
      }
      await fetch(FORM_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({[FORM_FIELD]:full}).toString()});
      const at=Date.now();setPending([{code,at,done:false},...pending().filter(x=>x.code!==code)]);
      st={i:0,a:{}};save();showWait(code,at);
    }catch(e){S.textContent='보내지 못함. 인터넷 연결을 확인하고 다시 누를 것.';send.disabled=false}
  };
  $('#reset').onclick=()=>{if(confirm('답을 모두 지우고 처음부터 할까요?')){st={i:0,a:{}};save();render()}};
}
render();
</script>
